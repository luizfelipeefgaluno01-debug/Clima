<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previsão do Tempo</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <h1>Previsão do Tempo</h1>

  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Digite a cidade..." value="São Paulo">
    <button id="searchBtn">Buscar</button>
  </div>

  <div id="weatherContainer" class="weather-card" style="display: none;">
    <div class="city" id="cityName">—</div>
    <div class="temp" id="temp">—°</div>
    <div class="desc" id="desc">—</div>
    <div class="details">
      <div class="detail">
        <span>Umidade</span>
        <strong id="humidity">—%</strong>
      </div>
      <div class="detail">
        <span>Vento</span>
        <strong id="wind">— km/h</strong>
      </div>
      <div class="detail">
        <span>Sensação</span>
        <strong id="feels">—°</strong>
      </div>
    </div>
  </div>

  <div class="forecast" id="forecast"></div>
  <div id="error" class="error"></div>

   <script src="script.js"defer></script>
</body>
</html>
